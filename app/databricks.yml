bundle:
  name: hawkerreach

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: "hawkerreach"
      description: "HawkerReach: hawker centre closures and senior access"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # Uncomment to enable on behalf of user API scopes. Available scopes: sql, genie, files, model-serving
      # user_api_scopes:
      #   - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  default:
    default: true
    workspace:
      host: https://dbc-98ae1c95-06a5.cloud.databricks.com

    variables:
      sql_warehouse_id: a8c31c5b693a27fd
