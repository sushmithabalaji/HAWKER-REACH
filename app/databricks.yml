bundle:
  name: hawkerreach

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Genie space for "Ask HawkerReach" (docs/genie/space.md)
  genie_space_name:
    description: Genie space display name

resources:
  apps:
    app:
      name: "hawkerreach"
      description: "HawkerReach: hawker centre closures and senior access"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # On behalf of user API scopes. Available scopes: sql, genie, files, model-serving
      # genie: AppKit's genie routes always run as the viewing user (Spec 6, #128), so each viewer needs
      # CAN_RUN on the space and SELECT on the gold tables it reads (Sql/01_app_grants.sql).
      user_api_scopes:
        - genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        # "Ask HawkerReach" (Spec 6). Bound even while HAWKERREACH_GENIE_ENABLED is off in app.yaml.
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-98ae1c95-06a5.cloud.databricks.com

    variables:
      sql_warehouse_id: a8c31c5b693a27fd
      genie_space_id: 01f1d6d1a23a1742ae05a2cda8ed8ce6
      genie_space_name: Ask HawkerReach
